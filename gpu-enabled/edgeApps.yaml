edgeApps:
  - name: edge-podinfo-primary
    repoURL: https://stefanprodan.github.io/podinfo
    chart: podinfo
    targetRevision: "6.7.0"
    namespace: podinfo-primary
    helm:
      values: |
        ingress:
          enabled: true
          hosts:
            - host: ""
              paths:
              - path: /
                pathType: ImplementationSpecific
  - name: edge-podinfo-secondary
    repoURL: https://stefanprodan.github.io/podinfo
    chart: podinfo
    targetRevision: "6.7.0"
    namespace: podinfo-secondary
    helm:
      parameters:
        - name: "ingress.enabled"
          value: "true"
        - name: "ingress.hosts"
          value: ""
