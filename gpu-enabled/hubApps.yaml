hubApps:
  - name: ca-bundle
    repoURL: https://stefanprodan.github.io/podinfo
    chart: podinfo
    targetRevision: "6.7.0"
    namespace: ca-bundle
    helm:
      parameters:
        - name: "ingress.enabled"
          value: "true"
        - name: "ingress.hosts"
          value: ""
  - name: hive
    repoURL: https://github.com/Q29vbA/flavors-machine
    path: hive
    targetRevision: feat/flavor-bootstrap
    namespace: argocd
