# Hub-side apps managed by central Argo CD for this flavor.
# `hive` is expanded later into edge bootstrap plus edge workload apps.
hubApps:
  - name: ca-bundle
    # lightweight stand-in for shared hub concern wiring
    repoURL: https://stefanprodan.github.io/podinfo
    chart: podinfo
    targetRevision: "6.7.0"
    namespace: ca-bundle
    helm:
      values: |
        ingress:
          enabled: true
          hosts:
            - host: ""
              paths:
              - path: /
                pathType: ImplementationSpecific
  - name: hive
    # hive is the hub-side app that fans out edge bootstrap + edge workloads
    repoURL: https://github.com/Q29vbA/flavors-machine
    path: hive
    targetRevision: HEAD
    namespace: argocd
