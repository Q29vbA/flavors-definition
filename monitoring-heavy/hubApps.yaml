hubApps:
  - name: ca-bundle
    repoURL: https://stefanprodan.github.io/podinfo
    chart: podinfo
    targetRevision: "6.7.0"
    namespace: ca-bundle
    helm:
      values: |
        ingress:
          enabled: true
          hosts:
            - host: ""
              paths:
              - path: /
                pathType: ImplementationSpecific
  - name: hive
    repoURL: https://github.com/Q29vbA/flavors-machine
    path: hive
    targetRevision: feat/flavor-bootstrap
    namespace: argocd
